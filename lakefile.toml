name = "lenet"
version = "0.1.0"
defaultTargets = ["Lenet", "LenetProofs", "LenetNet"]

[[lean_lib]]
name = "Lenet"

# Formal proofs over the Lenet core. Kept as a separate library so the C
# distribution (Lenet:static) never compiles them; theorems are erased at
# runtime anyway, but this keeps the dependency direction explicit:
# LenetProofs -> Lenet, never the reverse.
[[lean_lib]]
name = "LenetProofs"

# Lenet over a UDP socket (`Lenet.Net`), for Lean programs. Its own
# library so the engine and the C distribution never depend on Std.Async.
[[lean_lib]]
name = "LenetNet"
roots = ["Lenet.Net"]

[[lean_exe]]
name = "replay"
root = "Replay"
srcDir = "test"

# Unit tests: targeted checks of what the golden traces cannot reach.
[[lean_exe]]
name = "unit"
root = "Unit"
srcDir = "test"

# Lenet.Net over real UDP sockets on 127.0.0.1.
[[lean_exe]]
name = "net"
root = "Net"
srcDir = "test"

# The Lean side of the Lenet.Net-against-ENet test (make -C test net-interop).
[[lean_exe]]
name = "netinterop"
root = "NetInterop"
srcDir = "test"

# The Lean side of the lossy-link test against ENet (make -C test lossy-interop).
[[lean_exe]]
name = "netstream"
root = "NetStream"
srcDir = "test"

# Benchmark: built in CI, run locally (baseline numbers in TODO.md).
[[lean_exe]]
name = "bench"
root = "Bench"
srcDir = "bench"