name = "lenet"
version = "0.1.0"
defaultTargets = ["Lenet", "LenetProofs"]

[[lean_lib]]
name = "Lenet"

# Formal proofs over the Lenet core. Kept as a separate library so the C
# distribution (Lenet:static) never compiles them; theorems are erased at
# runtime anyway, but this keeps the dependency direction explicit:
# LenetProofs -> Lenet, never the reverse.
[[lean_lib]]
name = "LenetProofs"

[[lean_exe]]
name = "replay"
root = "Replay"
srcDir = "test"

# Phase 3 benchmark executable (TODO.md, "Phase 3 - Performance").
# Compile-only in CI; run it locally to record baseline numbers.
[[lean_exe]]
name = "bench"
root = "Bench"
srcDir = "bench"